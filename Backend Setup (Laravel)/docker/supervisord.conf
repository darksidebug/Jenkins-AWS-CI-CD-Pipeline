[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true

[program:laravel-schedule]
command=sh -c "while [ true ]; do php /var/www/html/artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
