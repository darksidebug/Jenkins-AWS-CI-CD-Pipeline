services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: linkage_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    networks:
      - linkage_network
    depends_on:
      - db
      - minio

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    container_name: linkage_nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html
    networks:
      - linkage_network
    depends_on:
      - app
      - php

  php:
    image: php:8.2-fpm
    container_name: linkage_php
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  db:
    image: mysql:8.0
    container_name: linkage_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - linkage_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - linkage_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: linkage_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    networks:
      - linkage_network
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    container_name: linkage_minio
    command: server --console-address ":9001" /data
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - linkage_minio:/data
    networks:
      - linkage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mc:
    image: minio/mc:latest
    container_name: linkage_mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '>> Ensuring bucket: ${MINIO_BUCKET}';
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set download local/${MINIO_BUCKET} || true
      "
    networks:
      - linkage_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

networks:
  linkage_network:

volumes:
  linkage_data:
  linkage_minio:
