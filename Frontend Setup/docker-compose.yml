version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: sample_web_app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_WEBPACK_USEPOLLING=1
      - CHOKIDAR_INTERVAL=200
      - NODE_ENV=development
    command: npm run dev
    ports:
      - "3000:3000"
